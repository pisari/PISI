<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pisi</title>
<meta name="theme-color" content="#2f6f5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
  // Opened from the installed icon: go straight to the app.
  var APP = "https://claude.ai/artifact/AjaMLGZSqCWtptXUWXmty5";
  if (matchMedia("(display-mode: standalone)").matches || location.search.indexOf("app=1") > -1) location.replace(APP);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Manrope,system-ui,sans-serif;color:#1c2621;background:linear-gradient(180deg,#e8f1f6,#ebf4f1);padding:24px}
  .c{max-width:380px;width:100%;text-align:center}
  .logo{width:132px;height:132px;margin:0 auto 18px;border-radius:30px;box-shadow:0 14px 34px -14px rgba(20,60,50,.45)}
  h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:40px;margin:0}
  p{color:#62737a;font-weight:600;line-height:1.5;margin:8px 0 26px}
  .btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;font:800 17px Manrope,sans-serif;cursor:pointer;text-decoration:none;margin-bottom:10px}
  .main{background:#21503d;color:#fff}
  .sec{background:#fff;color:#21503d;border:1px solid #dbe6ea}
  .help{display:none;background:#fff;border:1px solid #dbe6ea;border-radius:16px;padding:14px 16px;text-align:left;font-weight:600;font-size:15px;line-height:1.5;margin-bottom:10px}
  .help b{color:#21503d}
</style>
</head>
<body>
<div class="c">
  <div class="logo"><svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f6f5c"/><stop offset="1" stop-color="#1d4a52"/></linearGradient></defs><rect width="100" height="100" rx="24" fill="url(#g)"/><g transform="translate(0 3)"><polygon points="22,14 42,36 20,44" fill="#e8843f"/><polygon points="78,14 58,36 80,44" fill="#cf6e2e"/><polygon points="25,22 36,35 24,39" fill="#7c3a1c"/><polygon points="75,22 64,35 76,39" fill="#6a3018"/><polygon points="20,42 50,32 50,82 29,62" fill="#ee8c45"/><polygon points="80,42 50,32 50,82 71,62" fill="#d97632"/><polygon points="50,32 43,44 50,56 57,44" fill="#f4a265"/><polygon points="22,46 41,58 50,82 30,64" fill="#f8f3ea"/><polygon points="78,46 59,58 50,82 70,64" fill="#e8e0d3"/><path d="M34.5 51.5 q3.5 -2.6 7.5 0.2 q-3.8 1.6 -7.5 -0.2z" fill="#1d2a24"/><path d="M65.5 51.5 q-3.5 -2.6 -7.5 0.2 q3.8 1.6 7.5 -0.2z" fill="#1d2a24"/><polygon points="46,76 54,76 50,81.5" fill="#1d2a24"/></g></svg></div>
  <h1>Pisi</h1>
  <p>La tua agenda con la volpina.<br>Installala per averla tra le tue app.</p>
  <button class="btn main" id="install">Installa Pisi</button>
  <div class="help" id="help">Tocca i <b>tre puntini ⋮</b> in alto a destra di Chrome e scegli <b>“Installa app”</b> oppure <b>“Aggiungi a schermata Home”</b>.</div>
  <a class="btn sec" id="open">Apri Pisi</a>
</div>
<script>
  document.getElementById("open").href = APP;
  var deferred = null;
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferred = e; });
  document.getElementById("install").addEventListener("click", function () {
    if (deferred) { deferred.prompt(); deferred.userChoice.then(function () { deferred = null; }); }
    else document.getElementById("help").style.display = "block";
  });
  window.addEventListener("appinstalled", function () {
    document.getElementById("install").textContent = "Installata! Trovi Pisi tra le tue app";
  });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
